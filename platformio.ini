[env:m5stack-papers3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

; M5Paper S3 has 16MB flash and OPI PSRAM
board_build.flash_size = 16MB
board_build.arduino.memory_type = qio_opi
board_build.partitions = default_16MB.csv
board_upload.flash_size = 16MB
board_build.f_cpu = 240000000L
board_build.f_flash = 80000000L

; Build flags for M5Paper S3
build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_M5STACK_PAPERS3
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=3
    -DCONFIG_SPIRAM_MODE_OCT=1
    -DCONFIG_SPIRAM_CACHE_WORKAROUND=1
    -DM5PAPER
    -DM5UNIFIED_PC_BUILD=0

; Upload settings
upload_speed = 921600
monitor_speed = 115200

; Library dependencies
lib_deps =
    m5stack/M5Unified@^0.1.16
    https://github.com/m5stack/M5GFX.git#develop
    bblanchon/ArduinoJson@^7.0.4
    https://github.com/bitbank2/JPEGDEC.git
    zlib-ng/zlib-ng@^2.1.0
    kuba2k2/minizip-ng@^4.0.5

; Filesystem settings
board_build.filesystem = littlefs
